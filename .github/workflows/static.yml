name: Deploy widgets to GitHub Pages

# Publishes ONLY the widgets/ folder. The Obsidian vault markdown is never
# built, so LaTeX / [[wikilinks]] can't break the deploy. The prose site is
# served separately by Obsidian Publish.

on:
  push:
    branches: ["main"]
    paths:
      - "widgets/**"
      - ".github/workflows/static.yml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage widgets as the site (preserve the /widgets/ URL prefix)
        run: |
          mkdir -p _site/widgets
          cp -r widgets/. _site/widgets/
          # The gallery file is named widgets-index.html; expose it at /widgets/
          if [ -f _site/widgets/widgets-index.html ]; then
            cp _site/widgets/widgets-index.html _site/widgets/index.html
          fi
          # GitHub Pages needs a root index.html. Mirror the widget gallery at /
          # while keeping its relative links pointed at /widgets/.
          cp _site/widgets/index.html _site/index.html
          sed -i '0,/<head>/s//<head>\n  <base href="widgets\/">/' _site/index.html
          touch _site/.nojekyll
          echo "Published tree:" && find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
